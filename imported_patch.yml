  "Visuals - Picture: Aspect ratio":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn6 "Picture for screens that are not 16:9. On 21:9 and 32:9 screens: a wider 3D view, the HUD, menus and text at their true shape, movies with black bars, fades and backdrops across the whole screen. On 16:10, 3:2 and 4:3 screens (Steam Deck, many laptops and tablets, older monitors): a taller 3D view, the HUD and menus at their true shape, movies with bars at the top and bottom. Pick the Aspect ratio that matches your screen and set RPCS3 GPU > Stretch To Display Area on. Known: the Ultimate Match quit dialog is stretched; some menu backdrops are stretched at the sides. Checked by the author in play at 21:9 (3840x1600) and 32:9 (3840x1080) with the 120 FPS entry."
    Patch Version: 3.2
