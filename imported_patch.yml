        Value: 0x39800006
        Allowed Values:
          "Original": 0x39800008
          "12% lower": 0x39800007
          "25% lower": 0x39800006
          "50% lower": 0x39800004
      "Starting gauge":
        Type: long_enum
        Value: 0x39800008
        Allowed Values:
          "Original": 0x39800008
          "25% higher": 0x3980000a
          "50% higher": 0x3980000c
