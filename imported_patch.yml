  "Framerate - Minigames: Tokkuri Toppling":
    Games: &kzg5
      "Ryu ga Gotoku Kenzan! (English translation)":
        BLJM60064: [ 01.00 ]
      "Ryu ga Gotoku Kenzan! (English translation, patches 6 to 12)":
        BLJM60064: [ 01.00 ]
      "Ryu ga Gotoku Kenzan! (English translation, initial release)":
        BLJM60064: [ 01.00 ]
      "Ryu ga Gotoku Kenzan! (Japanese original)":
        BLJM60064: [ 01.00 ]
    Author: "Pakundo"
    Notes: "Keeps Tokkuri Toppling (the bottle game; \"Bowling\" in 2.2) at its original speed at 60 and 120 FPS. Safe to leave on: it only acts with a 60 or 120 FPS entry."
    Patch Version: 3.2
    Patch:
      - [ load, *kenzan_umod_bowling ]
  "Gameplay cheats - Minigames: Tokkuri Toppling":
    Games: *kzg5
    Author: "Pakundo"
    Notes: "Tokkuri Toppling (the bottle game): the opponent makes mistakes more often. The original chances are 10 percent for position, 40 for power, 25 for aim and 5 for hook; this sets all four to one value. With Always, all four mistakes hit every opponent throw in a test (7 of 7 with the 120 FPS entry, 6 of 6 with the 60 FPS entry; none of 6 throws without the entry). 40%, 60% and 80% were not measured. By the code it acts on opponents of the game's skill level 1, as the test opponent was; other levels keep their own play. Changes the difficulty."
    Patch Version: 3.2
    Configurable Values:
      "Opponent mistakes":
        Type: long_enum
        Value: 0x2f80003b
        Allowed Values:
          "40%": 0x2f800027
          "60%": 0x2f80003b
          "80%": 0x2f80004f
          "Always": 0x2f800063
    Patch:
      - [ calloc, 0x00012098, 1 ]
      - [ be32, 0x00000000, "Opponent mistakes" ]
      - [ calloc, 0x0001212c, 1 ]
      - [ be32, 0x00000000, "Opponent mistakes" ]
      - [ calloc, 0x000121c0, 1 ]
      - [ be32, 0x00000000, "Opponent mistakes" ]
      - [ calloc, 0x00012254, 1 ]
      - [ be32, 0x00000000, "Opponent mistakes" ]
      - [ be32, 0x00000000, 0xf821ff91 ]

