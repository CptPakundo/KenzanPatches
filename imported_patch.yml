PPU-5d3cde094c0be606290c4716da497bced59c1256:
  "Framerate - Core: 60 FPS":
    Games: &kzg1
      "Ryu ga Gotoku Kenzan! (English translation, initial release)":
        BLJM60064: [ 01.00 ]
    Author: "Pakundo"
    Group: "FPS"
    Notes: &kzn1 "Plays the whole game at 60 FPS at its original speed. Keep RPCS3's default Vblank Rate 60. Pick this or 120 FPS, not both, and also tick Clean picture and the Framerate - Minigames entries."
    Patch Version: 3.1
    Patch:
      - [ load, *kzp_60_fps ]
  "Framerate - Core: 120 FPS":
    Games: *kzg1
    Author: "Pakundo"
    Group: "FPS"
    Notes: &kzn2 "Plays the whole game at up to 120 FPS at its original speed. Needs a custom configuration for this game: Advanced > Vblank Rate 120 and GPU > Framerate Limiter Auto. On a weaker PC, use 60 FPS instead. Pick this or 60 FPS, not both, and also tick Clean picture and the Framerate - Minigames entries."
    Patch Version: 3.1
    Patch:
      - [ load, *kzp_120_fps ]
  "Visuals and Functionality: Clean picture":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn3 "Removes the blur on every frame and the grid on blurred backgrounds, and keeps edges clean at any Resolution Scale. Replaces the old optional sh_iori_ps3.par file: nothing to copy."
    Patch Version: 3.1
    Patch:
      - [ load, *kenzan60_image ]
  "Visuals and Functionality: Camera speed":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn4 "Changes how fast the right stick turns the camera. 100% is the original speed. Set Camera speed and Camera ramp to the same value. Tested on street turns at 120, 60 and the original 30 FPS."
    Patch Version: 3.1
    Configurable Values: &kzc1
      "Camera speed":
        Type: long_enum
        Value: 0x38000060
        Allowed Values:
          "50%": 0x38000020
          "75%": 0x38000030
          "100% (original)": 0x38000040
          "125%": 0x38000050
          "150%": 0x38000060
          "200%": 0x38000080
          "300%": 0x380000c0
