  "Gameplay cheats: Hold to mash":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn70 "Hold the button instead of mashing; a held button counts as about 10 presses a second. Checked by the author in play with the 120 FPS entry, and again with the 60 FPS entry: the Circle mash in a Heat Action (start holding after the prompt shows), getting up with Cross held after a knock-down, escaping a grab with Cross held or countering it with a Circle throw, and the boss Heat charge with R2 held. In a scripted test with the 120 and 60 FPS entries a held Cross brought the get-up timer down 10 steps a second (without the entry a hold counts once), and a grab ended in about 0.5 s with Cross held. Holding does not help against a stun. Recovering from a throw is not confirmed. Single-press prompts are not changed."
    Patch Version: 3.1
    Patch:
      - [ load, *kzp_hold_to_mash ]
