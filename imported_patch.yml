          "10%": 0x3980000d
          "5%": 0x39800006
          "2%": 0x39800003
    Patch:
      - [ load, *kzp_stick_dead_zone ]
  "Visuals and Functionality: Camera vertical reach":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn77 "Lets the right stick move the camera further up and down than the original. x1.0 is the original. Seen outdoors on a Gion street with the 60 and 120 FPS entries: at x1.5 the camera goes clearly lower and higher at full stick. The author checked x1.5 in play with the 60 and 120 FPS entries. Indoors, slopes and other streets were not checked. Camera speed sets the left-right turn."
    Patch Version: 3.1
    Configurable Values: &kzc47
      "Vertical reach":
        Type: long_enum
        Value: 0xc01e8070
        Allowed Values:
          "x1.0 (original)": 0xc01e8010
          "x1.25": 0xc01e8504
          "x1.5": 0xc01e8070
    Patch:
      - [ load, *kzp_camera_vertical_reach ]
  "Visuals and Functionality: Run threshold":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn78 "How far you tilt the left stick before Kiryu runs instead of walking. Full tilt is the original. At a 0.6 tilt Kiryu walked at 1.9 m/s without the entry and ran at 4.5 m/s with Half tilt."
    Patch Version: 3.1
    Configurable Values: &kzc48
      "Run at":
