          "Half tilt": 0xc1be83ec
          "Any tilt": 0xc1be8050
    Patch:
      - [ be32, 0x001b9450, "Run at" ]
  "Visuals and Functionality: Lock-on toggle":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn79 "Press R1 once to lock on and again to release, instead of holding it. Every tap toggled once with the 120 and the 60 FPS entry. What R1 does outside fights was not checked."
