  "Gameplay - Bug fix: Turtle title race freeze":
    Games: *kzg1
    Author: "Pakundo"
    Group: "Turtle title race freeze"
    Notes: &kzn74 "Fixes a freeze of the original game (by the code, it does not depend on RPCS3 or the frame rate). Entering a turtle of ability 59 or less in the Adamantine Cup or the Strongest Undefeated GP hangs the game for good: the race needs five rivals strong enough for these races, only three exist for a weak turtle, and the game never stops looking. With this fix it gives up after a long search: first it lets in the strong rivals it normally keeps from weak turtles (they are as strong as the others), and only as a last resort it takes the rival it has in hand. Races that start without the fix are not changed. Tested at ability 54: the game froze without the fix and not with it. A race running to its end was not watched."
    Patch Version: 3.2
    Patch:
      - [ load, *kzp_turtle_title_race_freeze ]
