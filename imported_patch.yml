  "Gameplay - Convenience: Save from the pause menu":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn15 "Experimental. Adds a Save prompt on Triangle to the pause menu. It opens the game's save list in free roam. It is greyed out in six scripted story stretches, in story fights and in Photo mode. Save stays enabled during the Oyo chase and on the walk to a yujo date (seen in a test), so do not save there; loading a save made there was not tested. The injured walk in the Kyoto Adventure and the date itself after ordering showed no free moment in a test. A full save and load was tested with the 120 FPS entry."
    Patch Version: 3.2
    Patch:
      - [ load, *kzp_save_from_the_pause_menu ]
