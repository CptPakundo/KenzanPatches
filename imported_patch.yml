  "Visuals and Functionality: Stick dead zone":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn76 "Makes the game's own stick dead zone smaller, for both sticks, so a small tilt already moves you or the camera. 23% is the original. RPCS3's own dead zone setting still applies first. Measured against the formula. The feel is yours to judge."
    Patch Version: 3.1
    Configurable Values: &kzc46
      "Dead zone":
        Type: long_enum
        Value: 0x3980000d
        Allowed Values:
