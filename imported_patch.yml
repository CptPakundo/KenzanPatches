  "Gameplay cheats: Coliseum prize item":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn80 "Chooses which of the four item prizes of a Coliseum tournament you get when you win. Original is a random pick (60, 30, 7 and 3 percent; the 3rd and 4th prizes are the rare materials, accessories and armour). Prize 2 and prize 4 were each won as chosen in a test. The money prize is unchanged (see Coliseum prize money)."
    Patch Version: 3.1
    Configurable Values: &kzc49
      "Item prize":
        Type: long_enum
        Value: 0x419d0368
        Allowed Values:
          "Random (original)": 0x419d0368
          "Always prize 1": 0x48000004
          "Always prize 2": 0x48000384
          "Always prize 3": 0x480005cc
          "Always prize 4 (rarest)": 0x48000378
    Patch:
      - [ load, *kzp_coliseum_prize_item ]
  "Gameplay cheats: Forging materials":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn81 "Blacksmith forging. Materials needed No lets you temper without the materials of the recipe. Materials used up No keeps the materials you have. Manuals needed No also drops the need for the crafting book. The weapon you temper and the fee are still needed. Each value was tested with one forge."
    Patch Version: 3.1
    Configurable Values: &kzc50
      "Materials needed":
        Type: long_enum
        Value: 0x419200b8
        Allowed Values:
          "Yes (original)": 0x419200b8
          "No": 0x60000000
      "Materials used up":
        Type: long_enum
        Value: 0x4beb18ad
        Allowed Values:
          "Yes (original)": 0x4beb18ad
          "No": 0x60000000
      "Manuals needed":
        Type: long_enum
        Value: 0x419e0080
        Allowed Values:
          "Yes (original)": 0x419e0080
          "No": 0x60000000
    Patch:
      - [ load, *kzp_forging_materials ]
  "Visuals and Functionality: Side missions at any hour":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn82 "Experimental. Side missions and people that only appear at a certain time of day (day, evening or night) can be met at any hour. Talks lets the time conditions of talks pass. People keeps people limited to a time of day always there, so some streets may show day and night people together. The clock, the light and the story are not changed. Tested with one giver who normally comes by day and evening (there at night with People, not without it) and with one shop talk that opened and sold with Talks. Other talks and shops were not checked."
    Patch Version: 3.1
    Configurable Values: &kzc51
      "Talks":
        Type: long_enum
        Value: 0x800b0004
        Allowed Values:
          "Original": 0x800b0004
          "Any hour": 0x38000003
      "People":
        Type: long_enum
        Value: 0x80090004
        Allowed Values:
          "Original": 0x80090004
          "Any hour": 0x38000003
    Patch:
      - [ load, *kzr419 ]
  "Gameplay cheats: Encounter refresh":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn83 "How often the groups of street thugs are drawn again. The original game draws them on every fifth area change. By the game's records, beaten groups stay away until then (a group was marked beaten by hand in the test). Use with Encounter rate to see its effect at once. Seen only in game memory, in Rakugai: Every area change drew new groups at each change, Every 2nd area change at every second one. No group was seen on screen or fought."
    Patch Version: 3.1
    Configurable Values: &kzc52
      "Refresh":
        Type: long_enum
        Value: 0x20630005
        Allowed Values:
          "Original": 0x20630005
          "Every area change": 0x38600001
          "Every 2nd area change": 0x38600002
    Patch:
      - [ be32, 0x00328f7c, "Refresh" ]
  "Visuals and Functionality: Stage detail":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn84 "Draws the full stage models where the game swaps in simplified far versions (for example the festival tower and the far part of the Gion street), using the developers' own \"force high detail\" switch. Only a few areas have far versions. In a test the simplified versions in use at the festival dropped from 2 to 0, with no frame-rate cost there. Memory use over a long walk was not checked."
    Patch Version: 3.1
    Configurable Values: &kzc53
      "Far areas":
        Type: long_enum
        Value: 0x8803001a
        Allowed Values:
          "Simplified when far (original)": 0x8803001a
          "Always full detail": 0x38000002
    Patch:
      - [ be32, 0x004df104, "Far areas" ]
  "Visuals and Functionality: Bloom intensity":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn85 "Scales the glow the game adds around bright areas (lanterns, sky, sunlit walls). Bloom: 100 is the original, 0 removes the glow, up to 300 makes it three times as strong."
    Patch Version: 3.1
    Configurable Values: &kzc54
      "Bloom (%)":
        Type: long_range
        Value: 100
        Min: 0
        Max: 300
    Patch:
      - [ load, *kzp_bloom_intensity ]
  "Visuals and Functionality: Depth of field":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn86 "The background blur of cutscenes and some talks. Strength: how much blur is blended in (100 is the original, 0 removes it). Use it with Clean picture."
    Patch Version: 3.1
    Configurable Values: &kzc55
      "Strength (%)":
        Type: long_range
        Value: 100
        Min: 0
        Max: 300
    Patch:
      - [ load, *kzp_depth_of_field ]
  "Visuals and Functionality: Notebook tracker":
    Games: *kzg1
    Author: "Pakundo"
    Notes: &kzn87 "English builds only. The Notebook lists (Requests, Contracts, Wanted Men) show every side mission as Locked (what to do first), Not now or Available (where to go). Started and finished missions show as before. The row of Request 100 (\"Justice For All\") also shows how many requests, contracts, wanted men and Coliseum opponents are done, and, until you start that request, your Coliseum win rate: by the game's code the last Coliseum opponent appears only at 80% or more. No game file is changed. In a test the lists matched the expected lists row by row. A giver offering a listed mission was not checked. Titles are in English only."
    Patch Version: 3.1
    Patch:
      - [ load, *kzp_notebook_tracker ]

