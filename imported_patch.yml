PPU-5d3cde094c0be606290c4716da497bced59c1256:
  "Framerate - Core: 60 FPS":
    Games: &kzg1
      "Ryu ga Gotoku Kenzan! (English translation, initial release)":
        BLJM60064: [ 01.00 ]
    Author: "Pakundo"
    Group: "FPS"
    Notes: &kzn1 "Plays the whole game at 60 FPS at its original speed. Keep RPCS3's default Vblank Rate 60. Pick this or 120 FPS, not both, and also tick Clean picture and the Framerate - Minigames entries."
    Patch Version: 3.2
    Patch:
      - [ load, *kzp_60_fps ]
  "Framerate - Core: 120 FPS":
    Games: *kzg1
    Author: "Pakundo"
    Group: "FPS"
    Notes: &kzn2 "Plays the whole game at up to 120 FPS at its original speed. Needs a custom configuration for this game: Advanced > Vblank Rate 120 and GPU > Framerate Limiter Auto. On a weaker PC, use 60 FPS instead. Pick this or 60 FPS, not both, and also tick Clean picture and the Framerate - Minigames entries."
    Patch Version: 3.2
    Patch:
      - [ load, *kzp_120_fps ]
  "Visuals - Picture: Clean picture":
